# Daily refresh of texas/data/opportunities.json from public feeds (no API keys).
name: Refresh Texas Opportunity data
on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC daily = 5:17 AM CDT / 4:17 AM CST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node texas/test.js
      - name: Build snapshot
        run: node scripts/build-opportunities.js
      # Also writes the weekly newsletter issues; the Monday run is the first after a week ends, so it finalizes that issue.
      - name: Build Intel feed (news and planning signals; one failing source never fails the job)
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/build-intel.js
      - name: Check a sample of Intel links (report only)
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/check-intel-links.js 2
      # Newsletter PDFs are published by publish-newsletter.yml (Sunday night); the daily run does not render them.
      - name: Re-run tests on the new data
        run: node test.js
      - name: Commit if changed
        run: |
          git add -N texas/data/   # new newsletter files show up in the diff
          if git diff --quiet -- texas/data/; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A texas/data/
            git commit -m "data(texas): daily snapshot refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
